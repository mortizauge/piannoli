name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number (e.g. 1.0.0)
        required: true
      branch:
        description: Branch to build from
        required: true
        default: main
      message:
        description: Release notes
        required: true
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Fetch RetroArch autoconfig cfgs
        run: ./scripts/fetch-autoconfig.sh

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Compute version code and patch build.gradle.kts
        run: |
          VERSION="${{ inputs.version }}"
          BASE="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          if [[ "$VERSION" == *-* ]]; then
            SUFFIX="${VERSION#*-}"
            PRE="${SUFFIX##*.}"
            [[ "$PRE" =~ ^[0-9]+$ ]] || PRE=1
            (( PRE > 98 )) && PRE=98
          else
            PRE=99
          fi
          VERSION_CODE=$(( ${MAJOR:-0} * 1000000 + ${MINOR:-0} * 10000 + ${PATCH:-0} * 100 + PRE ))
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ inputs.version }}\"/" app/build.gradle.kts
          echo "versionCode=$VERSION_CODE, versionName=${{ inputs.version }}"

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/release.keystore" \
            "-Pandroid.injected.signing.store.password=$STORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "apk_name=piannoli-${{ inputs.version }}-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ inputs.message }}
          prerelease: ${{ inputs.prerelease }}
          target_commitish: ${{ inputs.branch }}
          files: app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
